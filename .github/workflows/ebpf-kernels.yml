# RanA multi-kernel eBPF harness (CLAUDE.md §5: "LTS kernels 5.15, 6.1, 6.6,
# latest").
#
# RanA's load-bearing events come from eBPF CO-RE programs (P1). CO-RE means
# "compile once, run everywhere" across kernel struct layouts — but that
# promise has to be *proven*, not assumed. This workflow boots a real VM for
# each LTS kernel (via cilium's little-vm-helper), loads the generated BPF
# objects, and runs the harness so a CO-RE relocation that breaks on 6.1 but
# works on 6.6 (or vice-versa) is caught.
#
# It needs a real kernel + root + BTF — infrastructure the pure-Go PR gate
# (ci.yml) deliberately does not require, and which the macOS dev host cannot
# run at all — and it pulls prebuilt kernel images from an external registry.
#
# STATUS: PROMOTED TO A REQUIRED GATE. Having validated green across
# 5.15/6.1/6.6/bpf-next (load, attach, capture, attribution, in-kernel
# filtering, reattach), the four `eBPF harness (<label>)` checks are required
# status checks on branch protection for changes to the kernel path (it runs
# on pull_request as well as push, so the required check can actually be
# satisfied on a PR). The compile-only `bpf compile-check` in ci.yml remains
# the fast-feedback front end. When refreshing kernel images, bump matrix
# `image` only — the `label` (and thus the required-check name) must stay
# stable, or the gate silently detaches.
name: ebpf-kernels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bpf/**"
      - "internal/bpf/**"
      - "internal/collector/**"
      - "cmd/ranad/**"
      - ".github/workflows/ebpf-kernels.yml"
  # Also on PRs touching the kernel path, so this can be (and is) a
  # REQUIRED status check: a required check that never runs on a PR would
  # block every PR forever. The stable job names below ("eBPF harness
  # (5.15)" …) are what branch protection matches — they must NOT embed
  # the dated image tag, or a routine image bump would rename the check
  # and silently break the gate.
  pull_request:
    paths:
      - "bpf/**"
      - "internal/bpf/**"
      - "internal/collector/**"
      - "cmd/ranad/**"
      - ".github/workflows/ebpf-kernels.yml"

permissions:
  contents: read

concurrency:
  group: ebpf-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: eBPF harness (${{ matrix.kernel.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # LTS floor (5.15) through current, plus bpf-next for early warning.
        # label = the STABLE name branch protection references; image = the
        # date-pinned lvh-images tag (the moving "-main" tags break lvh
        # v0.0.30's cached-pull name derivation). Bump `image` deliberately
        # when refreshing kernels; NEVER let the dated tag leak into `label`
        # or the required-check name changes out from under the gate.
        kernel:
          - { label: "5.15", image: "5.15-20260629.014609" }
          - { label: "6.1", image: "6.1-20260629.014609" }
          - { label: "6.6", image: "6.6-20260629.014609" }
          - { label: "bpf-next", image: "bpf-next-20260629.014609" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install clang / llvm (BPF codegen)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: generate CO-RE objects + compile the harness test binary
        id: prep
        run: |
          set -euo pipefail
          # Produce the bpf2go CO-RE objects. A generation failure is a
          # hard failure — a harness that silently skips generation would
          # go green without testing anything (the hollow-gate trap).
          go generate ./internal/bpf
          # Assert generation actually produced bindings: `go generate`
          # exits 0 having done NOTHING if the directive file is excluded
          # by build constraints (this bit us: gen.go was `//go:build
          # ignore`-tagged and generate silently skipped it).
          ls internal/bpf/*_bpfel.go >/dev/null 2>&1 || {
            echo "go generate produced no *_bpfel.go bindings — generation silently no-opped"; exit 1; }
          # Compile (do NOT run) the root+kernel harness into a static
          # binary the VM can execute. rana_bpf_generated unlocks the real
          # NewLoader attach path; bpf_harness unlocks the kernel tests
          # (internal/bpf/harness_linux_test.go). The binary MUST exist —
          # this workflow's entire purpose is running it.
          CGO_ENABLED=0 go test -c -tags "bpf_harness,rana_bpf_generated" \
            -o ./bpf-harness.test ./internal/bpf
          test -f ./bpf-harness.test || { echo "harness binary missing"; exit 1; }
          # Prove the real daemon wiring compiles against the generated
          # bindings: cmd/ranad's generated record source (bpf_source_
          # generated_linux.go) drives bpf.NewLoader and exposes it as the
          # pump's SessionRegistrar. Nothing else in CI builds this tag for
          # cmd/ranad, so without this a drift between the daemon and the
          # loader API would only surface at release time.
          CGO_ENABLED=0 go build -tags rana_bpf_generated ./cmd/ranad
          echo "cmd/ranad builds with generated eBPF bindings"

      - name: boot ${{ matrix.kernel.label }} and run the harness as root
        uses: cilium/little-vm-helper@v0.0.30
        with:
          test-name: rana-ebpf-${{ matrix.kernel.label }}
          image: complexity-test
          image-version: ${{ matrix.kernel.image }}
          host-mount: ./
          install-dependencies: "true"
          # REQUIRED: the action roots its image/kernel dirs at
          # "<images-folder-parent>/images/..."; left empty they land at
          # filesystem root and the lvh CLI's pull fails with "invalid
          # reference format". Every cilium consumer passes /tmp.
          images-folder-parent: "/tmp"
          cmd: |
            set -e
            uname -a
            mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true
            mount -t tracefs tracefs /sys/kernel/tracing 2>/dev/null || true
            # Run from the package directory: the package's source-grep
            # tests (invariants, records-header cross-checks) read
            # ../../bpf/src relative to internal/bpf, exactly as `go test`
            # would. RANA_BPF_TESTS gates the attach/harness tests inside
            # the test binary so they only run where a real kernel is
            # present (here).
            cd /host/internal/bpf
            RANA_BPF_TESTS=1 /host/bpf-harness.test -test.v
