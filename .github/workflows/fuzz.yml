# Continuous fuzzing of RanA's trust-boundary parsers.
#
# The seed corpora run on every PR (inside `go test`), but that only replays
# known inputs. This workflow spends real fuzzing time NIGHTLY on the parsers
# that sit on a trust boundary — anything that decodes attacker- or
# kernel-influenced bytes — so a crash or a redaction miss is found by the
# project, continuously, not by a user. A discovered crasher is uploaded as an
# artifact and fails the job; committing it under testdata/fuzz/ turns it into
# a permanent regression seed (Go's native fuzzing convention).
name: fuzz

on:
  schedule:
    - cron: "17 4 * * *" # nightly, 04:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz duration (Go -fuzztime, e.g. 300s)"
        default: "180s"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/redact, target: FuzzRedact }
          - { pkg: ./internal/wire, target: FuzzReadFrame }
          - { pkg: ./internal/cborcanon, target: FuzzDecodeEncode }
          - { pkg: ./internal/exportverify, target: FuzzVerifyExportFiles }
          - { pkg: ./internal/collector, target: FuzzDecodeRecord }
          - { pkg: ./internal/collector, target: FuzzDecodeExecRecord }
          - { pkg: ./internal/collector, target: FuzzDecodeFsOpRecord }
          - { pkg: ./internal/collector, target: FuzzDecodeDNSRecord }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz ${{ matrix.target }}
        run: |
          ft="${{ github.event.inputs.fuzztime || '180s' }}"
          echo "fuzzing ${{ matrix.target }} in ${{ matrix.pkg }} for $ft"
          # -run '^$' so only the fuzzer runs (not the unit tests); a single
          # exact target per job so each parser gets its own budget.
          go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$ft" "${{ matrix.pkg }}"
      - name: upload any discovered crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: |
            **/testdata/fuzz/${{ matrix.target }}/**
          if-no-files-found: ignore
