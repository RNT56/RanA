# RanA profile: claude-code
# Anthropic's Claude Code CLI. Typically a repo-scoped coding agent.

[profile]
name        = "claude-code"
description = "Claude Code CLI — repo-scoped coding agent."
version     = 1

[match]
auto = true
# Heuristic identification when adopting/attaching without an explicit profile.
exe_basename = ["claude"]
argv_contains = ["claude-code"]
# Note: Claude Code may run under its own /sandbox. RanA observes it regardless —
# the sandbox runs on the same kernel, so eBPF sees through it. Observing a
# sandboxed agent is a recommended recipe (see docs/ARCHITECTURE.md, P8).

[capture]
exec            = true
fork_exit       = true
file_write      = true
file_meta_ops   = true
network_connect = true
network_flow    = true
unix_sockets    = true

[digest]
# Coding agents earn their keep on the working tree, so before/after content
# digests here are high-value. Default to the cwd the session started in.
scopes = ["$SESSION_CWD/**"]
exclude = ["**/.git/objects/**", "**/node_modules/**", "**/target/**", "**/.venv/**"]

[sensitive_read]
extra = [
  "~/.config/gh/**",          # gh CLI tokens a coding agent might reach for
  "~/.npmrc",                 # npm auth (the Cline incident class)
  "~/.cargo/credentials*",
  "~/.pypirc",
]

[markers]
# Optional first-party enrichment channel. The ~150-LOC Claude Code hook
# (plugins/claude-code/rana-marker.js) emits run-lifecycle markers over the
# rana marker socket, upgrading the raw event river into
# "session started -> these execs -> these egress connects -> this file changed".
#
# CRITICAL (P7): markers carry IDENTIFIERS AND LIFECYCLE ONLY.
#   runId, agentId, channel, status, phase, ts  -> yes
#   message text / prompt / completion / summary -> NEVER
# Markers are enrichment (P1): origin=enrichment. A forged marker can mislabel,
# never fabricate a kernel event. If RANA_MARKER_SOCKET is unset the hook is
# inert, and RanA falls back to process-tree + time clustering.
enabled       = true
socket        = "$RANA_MARKER_SOCKET"   # per-session random token issued at record/adopt time
events        = ["run.start", "run.end"]
# maps to Claude Code's hook lifecycle (https://code.claude.com/docs/en/hooks):
#   SessionStart          {session_id, source}   => run.start {status:"accepted"}
#   SessionEnd (or Stop)  {session_id, reason}   => run.end   {status:"completed"|"error"}
# (see plugins/claude-code/rana-marker.js and plugins/claude-code/README.md)
carry_fields  = ["runId", "agentId", "channel", "status", "phase", "ts"]
forbid_fields = ["text", "prompt", "completion", "message", "content", "summary"]

[timeline]
lens = "tree"                 # process tree reads naturally for a coding session

[retention]
ttl_days = 30
