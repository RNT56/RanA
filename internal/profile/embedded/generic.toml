# RanA profile: generic
# The zero-knowledge default. Applied when no specific profile matches.
# Captures the full effect surface with conservative, safe defaults.

[profile]
name        = "generic"
description = "Default profile for any agent or process. Safe, complete, no assumptions."
version     = 1

[match]
# generic matches nothing automatically; it is the explicit fallback for
#   rana run -- <cmd>
# with no --profile given.
auto = false

[capture]
# Everything in the D7 hook set is on; this is the baseline product.
exec            = true
fork_exit       = true
file_write      = true
file_meta_ops   = true      # unlink, rename, mkdir, chmod, truncate
network_connect = true
network_flow    = true      # bytes/duration on close
unix_sockets    = true

[digest]
# Content digests (BLAKE3 on close-write) are EXPENSIVE and privacy-sensitive,
# so generic computes them for nothing by default. A user can add scopes.
scopes = []                 # e.g. ["~/project/**"] to digest a working tree

[sensitive_read]
# In-kernel watchlist (resolved-path prefix + (dev,inode) pinning; see plan D7).
# These are the built-in credential locations; a read of any of them is the
# highest-signal event class. The built-ins also include RanA's OWN data
# directory (ledger, signing key, salt) — an agent touching the recorder is
# itself a first-class recorded event (plan D27).
# Profiles may EXTEND this list; the built-ins cannot be removed.
extra = []                  # add paths here; built-ins always apply

[markers]
enabled = false             # generic has no agent integration to enrich from

[timeline]
lens = "tree"               # default view: process tree + fs + network lanes

[retention]
ttl_days = 30               # sealed segments older than this are gc-eligible
